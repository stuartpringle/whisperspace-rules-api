title: Equipment & Gear
slug: equipment-gear
level: 1
content: []
sections:
- title: The Right Tool for the Job
  slug: the-right-tool-for-the-job
  level: 2
  content:
  - type: paragraph
    text: In some cases, skill checks may be aided by using the right tool for the
      job. If you have a shovel, it is considered to be the right tool for the job
      of digging a hole; it is not the right tool for the job for performing a heart
      transplant. Similarly, a medkit is the right tool for the job for treating a
      character’s wounds, while a ship’s well-stocked medbay may be considered the
      right tool for the job for performing surgery.
    spans:
    - style: bold
      text: right tool for the job
  - type: paragraph
    text: When performing a skill check with the right tool for the job, gain +1 bonus
      die.
    spans:
    - style: bold
      text: skill check with the right tool for the job, gain +1 bonus die
  - type: paragraph
    text: In cases where a tool is required but the right tool for the job is unavailable,
      it may be possible to improvise with another tool (GM’s discretion), however
      using improvised tools imposes +1 penalty die on the check.
    spans:
    - style: bold
      text: using improvised tools imposes +1 penalty die
  - type: paragraph
    text: Sometimes items may specify what jobs they are the right tool for, however
      most often they will not. Whether or not something is the right tool for any
      particular job is meant to be a common-sense judgment call made by the GM; players
      may make suggestions or advocate for uses of tools, but the final decision always
      rests with the GM.
    spans: []
  sections: []
- title: Salvaging
  slug: salvaging
  level: 2
  content: []
  sections: []
- title: Crafting
  slug: crafting
  level: 2
  content: []
  sections: []
- title: Repair and Modification
  slug: repair-and-modification
  level: 2
  content:
  - type: paragraph
    text: Sometimes things break; other times, they aren’t quite what they need to
      be. Either way, repairing or modifying equipment takes time and the right set
      of tools - not to mention the expertise to use them.
    spans: []
  - type: paragraph
    text: 'Any character may attempt to repair equipment outside of combat, however
      a character without any skill ranks in Engineering suffers +1 penalty die to
      their roll. To attempt a repair, roll an Engineering check:'
    spans: []
  - type: paragraph
    text: Repair DC = 6 + durability lost.
    spans:
    - style: bold
      text: Repair DC = 6 + durability lost.
  - type: paragraph
    text: For example, a Streetweave Jacket normally has 5 durability. To repair one
      with only 1 point of durability remaining, the DC would be 10 (6 + 4) as the
      jacket had lost 4 durability.
    spans: []
  - type: paragraph
    text: On Extreme Success, restore up to 2 points of durability.
    spans:
    - style: bold
      text: On Extreme Success
  - type: paragraph
    text: On Success, restore 1 point of durability.
    spans:
    - style: bold
      text: On Success
  - type: paragraph
    text: On Failure, increase the next repair check DC by +1.
    spans:
    - style: bold
      text: On Failure
  - type: paragraph
    text: On Extreme Failure, the item suffers 1 damage.
    spans:
    - style: bold
      text: On Extreme Failure
  - type: paragraph
    text: Each repair check takes 1 hour and consumes 1 material (or one use of the
      repair kit) whether the repair was successful or not. You cannot repair equipment
      above its base durability.
    spans:
    - style: bold
      text: Each repair check takes 1 hour and consumes 1 material
  - type: paragraph
    text: An item with 0 remaining durability cannot be repaired; it is broken. It
      may possibly be used as parts for other repairs (GM discretion). Items which
      have no listed durability can still break or require repairs; these are assumed
      to have a base durability of 4.
    spans:
    - style: bold
      text: An item with 0 remaining durability cannot be repaired
    - style: bold
      text: Items which have no listed durability
  - type: paragraph
    text: Modifying equipment works the same way as repairing equipment, but does
      not require materials other than the modification you wish to install. Only
      advanced and expert modifications require an Engineering check or take longer
      than one action to enact; simple modifications may be done (or undone) mid-combat
      and require no roll, only the use of an action.
    spans:
    - style: bold
      text: Modifying equipment
  - type: paragraph
    text: 'Modification DC: 8 (advanced, 2 hours), 10 (expert, 4 hours)'
    spans:
    - style: bold
      text: 'Modification DC:'
  - type: paragraph
    text: Unless otherwise specified, a modification is considered simple.
    spans: []
  sections:
  - title: Paid Experts
    slug: paid-experts
    level: 3
    content:
    - type: paragraph
      text: Typically a mechanic or expert weaponsmith might charge one tenth the
        item’s cost and take 4 hours per durability point restored. This process can
        often be sped up by paying a higher price. Similarly, they might charge 50
        credits and take 4 hours to make a simple modification, 300 credits and take
        6 hours to make an advanced modification, and 1500 credits and take 2 days
        to make an expert modification. These prices and time costs are provided as
        a baseline; GMs should feel free to increase or decrease them as they see
        fit.
      spans: []
    sections: []
  - title: Circumstantial Effects
    slug: circumstantial-effects
    level: 3
    content:
    - type: paragraph
      text: If attempting a repair or modification check in an appropriate environment
        (for example, in a repair shop or engineering bay), gain +1 bonus die to your
        Engineering check.
      spans: []
    - type: paragraph
      text: If attempting a repair or modification without proper tools or with improvised
        materials (not using a repair kit or materials found in an appropriate environment),
        suffer +1 penalty die to your Engineering check.
      spans: []
    sections: []
- title: Concealing Gear
  slug: concealing-gear
  level: 2
  content:
  - type: paragraph
    text: Civilized space stations, settlements, or space ships usually do not allow
      openly carrying weaponry or wearing armour, except for security personnel or
      special exceptions. Some of these locations may have highly advanced automated
      scanners to detect the presence of weapons, armour, or other banned equipment,
      while others may rely on a guard watching all newcomers to make sure they’re
      not obviously packing heat.
    spans: []
  - type: paragraph
    text: Either way, characters wishing to carry a weapon or other item in a no-carry
      zone may attempt to conceal it on their persons. Doing so requires a Subterfuge
      check to see how well the item is concealed on their person. Concealing any
      item of more than 2 bulk imposes +1 penalty die on this roll; concealing an
      item of 5 or more bulk imposes +2 penalty dice to this roll. Concealing an item
      of 1 bulk grants +1 bonus die to this roll. It is impossible to conceal an item
      of 10 bulk or more.
    spans: []
  - type: paragraph
    text: Characters attempting to suss out if another character is carrying something
      concealed on their person must roll Observe (DC = result of other character’s
      Subterfuge roll).
    spans: []
  sections: []
