  - title: Narcotics
    slug: narcotics
    level: 3
    content: []
    sections:
    - title: Addiction
      slug: addiction
      level: 4
      content:
      - type: paragraph
        text: For every narcotic, the user must roll for Addiction after each use,
          as described below. A character already addicted to a narcotic does not
          have to make this roll. Narcotics have a bulk of 1.
        spans: []
      - type: paragraph
        text: 'Addiction roll: character must roll a Willpower (DC 6 + narcotic’s
          Addiction Score) check.'
        spans:
        - style: bold
          text: 'Addiction roll: character must roll a Willpower (DC 6 + narcotic’s
            Addiction Score) check.'
      - type: paragraph
        text: On a failed Addiction roll, the character becomes addicted to the narcotic
          and must progress through the Addiction table below, beginning with Onset.
        spans: []
      - type: table
        rows:
        - - &id008
            text: Addiction Effects
            spans: []
          - *id008
        - - text: Stage
            spans:
            - style: bold
              text: Stage
          - text: Effect
            spans:
            - style: bold
              text: Effect
        - - text: Onset
            spans: []
          - text: Character desires the substance. Each week without it, roll Addiction.
              On success, remove the addiction. On failure, increase the DC by 1.
              On extreme failure, progress to Dependence.
            spans: []
        - - text: Dependence
            spans: []
          - text: Character requires the substance. Without it, they gain the Demoralized
              condition. Each week without it, roll Addiction. On extreme success,
              remove the addiction. On success, go back to Onset. On failure, progress
              to Addiction.
            spans: []
        - - text: Addiction
            spans: []
          - text: Character’s sole purpose in life is to have and use the substance.
              Without it, they gain the Agonized and Fleeing conditions. Each week
              without it, roll Addiction. On success, go back to Dependence. On failure,
              suffer stress equal to the substance’s Addiction Score. On extreme failure,
              the character suffers a severe withdrawal crisis and gains the Dying
              condition.
            spans: []
      sections: []
    - title: Addiction Effects
      slug: addiction-effects
      level: 4
      content: []
      sections: []
    - title: Detox
      slug: detox
      level: 4
      content:
      - type: paragraph
        text: 'A character suffering from an addiction may attempt a medically supervised
          detox. This requires:'
        spans: []
      - type: list
        ordered: false
        items:
        - text: Access to medical facilities (such as a clinic, medbay, or hospital)
          spans: []
        - text: Uninterrupted rest there
          spans: []
        - text: Medical supplies (cost below)
          spans: []
      - type: paragraph
        text: A character actively going through detox does not make the weekly Addiction
          checks as normal. After detox, these resume (if applicable).
        spans: []
      - type: table
        rows:
        - - text: Addiction Stage
            spans:
            - style: bold
              text: Addiction Stage
          - text: Time
            spans:
            - style: bold
              text: Time
          - text: Supply Cost
            spans:
            - style: bold
              text: Supply Cost
        - - text: Onset
            spans: []
          - text: 2 days
            spans: []
          - text: 500 credits
            spans: []
        - - text: Dependence
            spans: []
          - text: 5 days
            spans: []
          - text: 3000 credits
            spans: []
        - - text: Addiction
            spans: []
          - text: 10 days
            spans: []
          - text: 8000 credits
            spans: []
      - type: paragraph
        text: At the end of the detox period, the character may make a Toughness or
          Willpower check.
        spans:
        - style: bold
          text: Toughness
        - style: bold
          text: Willpower
      - type: paragraph
        text: Detox DC = 6 + Addiction Score
        spans:
        - style: bold
          text: Detox DC = 6 + Addiction Score
      - type: list
        ordered: false
        items:
        - text: 'Extreme success: reduce addiction by two stages (from Addiction to
            Onset, or from Dependence to no addiction, for example)'
          spans:
          - style: bold
            text: Extreme success
        - text: 'Success: reduce addiction by one stage'
          spans:
          - style: bold
            text: Success
        - text: 'Failure: no change to addiction stage; suffer +1 stress'
          spans:
          - style: bold
            text: Failure
        - text: 'Extreme failure: suffer + 1d4 stress and gain the Agonized 1 condition
            for 1 day'
          spans:
          - style: bold
            text: Extreme failure
      - type: paragraph
        text: Other characters may attempt to aid in this check. To do so, they may
          make a First Aid (DC 6 + addiction stage; 1 for Onset, 2 for Dependence,
          3 for Addiction) check.
