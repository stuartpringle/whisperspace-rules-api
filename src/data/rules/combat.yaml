title: Combat
slug: combat
level: 1
content:
- type: paragraph
  text: Combat is tracked through rounds. Before the first round, the GM will call
    for a Reflex check from each player (and will roll for NPCs). This determines
    the initiative order for each round of combat (highest result to lowest).
  spans: []
sections:
- title: Action Economy
  slug: action-economy
  level: 2
  content:
  - type: paragraph
    text: At the start of combat, each player character and each NPC gains 1 reaction.
      At the start of each character’s turn, that character gains 3 actions and 1
      reaction. If the character has unused actions or reactions from his previous
      turn, those are lost.
    spans: []
  sections:
  - title: Fully Commit
    slug: fully-commit
    level: 3
    content:
    - type: paragraph
      text: When in turn-based play (during combat, for example), you may choose to
        spend 3 actions on a task that would normally take only one action. Doing
        so grants +1 bonus die to any rolls associated with that task. For example,
        you could Fully Commit to an attack against an enemy; doing so uses 3 actions
        and grants +1 bonus die on this attack.
      spans: []
    sections: []
- title: Surprise
  slug: surprise
  level: 2
  content:
  - type: paragraph
    text: Ambushes, bushwhacks, and carefully-planned take-downs can result in situations
      in which characters are unaware of danger until it is too late to react to it.
      In these situations, a Surprise Round is played out before regular combat rounds.
    spans: []
  - type: paragraph
    text: Characters who are unaware of the attackers or the threat are Surprised
      and therefore cannot act in this round, either with actions or reactions. Surprised
      characters gain 1 stress immediately.
    spans: []
  - type: paragraph
    text: Characters who are aware of what’s going on (either by perceiving the ambush
      before it hits, or by being part of the ambush itself) act on their initiative
      as normal.
    spans: []
  sections:
  - title: Ambush Severity
    slug: ambush-severity
    level: 3
    content:
    - type: paragraph
      text: To determine how well-executed and concealed an ambush is, the ambushers
        roll a Stealth or Subterfuge check (using the highest skill rank among them).
        This may range from 1 (sloppy) to 5 (near-perfect); see the table below.
      spans: []
    - type: table
      rows:
      - - text: Roll
          spans:
          - style: bold
            text: Roll
        - text: Ambush Severity
          spans:
          - style: bold
            text: Ambush Severity
      - - text: 0-3
          spans: []
        - text: '1'
          spans: []
      - - text: 4-6
          spans: []
        - text: '2'
          spans: []
      - - text: 7-9
          spans: []
        - text: '3'
          spans: []
      - - text: 10-12
          spans: []
        - text: '4'
          spans: []
      - - text: 13+
          spans: []
        - text: '5'
          spans: []
    sections:
    - title: 'Special rule: Instinct'
      slug: special-rule-instinct
      level: 4
      content:
      - type: paragraph
        text: 'If a surprised character’s Instinct skill rank equals or exceeds the
          Ambush Severity, they:'
        spans: []
      - type: list
        ordered: false
        items:
        - text: May take reactions as normal during the surprise round
          spans: []
        - text: May roll an Instinct check (DC8 + Amish Severity) at the start of
            his turn during the surprise round.
          spans: []
      - type: list
        ordered: false
        items:
        - text: 'On extreme success: he may take up to 2 actions despite being Surprised.'
          spans: []
        - text: 'On success: he may take 1 action despite being Surprised.'
          spans: []
      sections: []
- title: Seizing the Initiative
  slug: seizing-the-initiative
  level: 2
  content:
  - type: paragraph
    text: At the start of a combat round, before any characters act, you may choose
      to act at the top of the initiative order. If you do, immediately gain +2 Stress.
      You may seize the initiative in a surprise round, however you may not do so
      if you are Surprised.
    spans:
    - style: bold
      text: +2 Stress
  sections: []
- title: Attacking
  slug: attacking
  level: 2
  content:
  - type: paragraph
    text: 'Here’s the formula:'
    spans: []
  - type: paragraph
    text: 1D12 + weapon skill mod VS Weapon Use DC + situational mods (distance, cover,
      evading, environmental effects, etc)
    spans:
    - style: bold
      text: 1D12 + weapon skill mod VS Weapon Use DC + situational mods (distance,
        cover, evading, environmental effects, etc)
  - type: paragraph
    text: Let’s break it down.
    spans: []
  - type: paragraph
    text: You use your weapon skill to fire the weapon. As with any skill roll, this
      requires you to roll a D12 and add your skill modifier to it. Thus, to fire
      a light weapon, you would roll a D12 and add your Light Weapons combat skill
      to the result.
    spans: []
  - type: paragraph
    text: To hit, you must meet or exceed your weapon’s DC. This reflects the fact
      that different weapons are easier or more difficult to fire accurately. If your
      light weapon has an accuracy of 10, then you would need to get 10 or higher
      with your roll to hit the target. However, other factors may enter into the
      equation. For example, your target may be behind partial cover (a +2 to the
      DC to hit), which would mean you would instead need a 12 or higher to hit them.
    spans: []
  - type: paragraph
    text: 'Distance is also a factor here: each weapon has a Range attribute. Firing
      a weapon at a target outside (farther away) than the weapon’s Range results
      in a +2 increase to the DC to hit per range band farther the target is from
      you. So if you were to fire a weapon with a range of Near at a target at Long
      distance, you would be crossing two range bands (Medium, Long), so the DC for
      your attack would go up by +4. Firing across three range bands (from Near to
      Very Long, for example) is considered an impossible shot and you automatically
      miss.'
    spans:
    - style: bold
      text: per range band
  - type: paragraph
    text: 'This system is meant to reflect the way shooting weapons works in real
      life: the shooter uses his weapon to fire at a target. If he shoots well, he
      hits. It’s possible to make yourself a more difficult target to hit, but mere
      humans do not exist in the Matrix; we cannot dodge bullets.'
    spans: []
  sections:
  - title: Multiple Attacks
    slug: multiple-attacks
    level: 3
    content:
    - type: paragraph
      text: Successive attacks you make on your turn are harder to make effectively.
        Every attack you make on a turn (after your first attack) suffers +1 penalty
        die to its roll.
      spans: []
    sections: []
  - title: Dual Wielding
    slug: dual-wielding
    level: 3
    content:
    - type: paragraph
      text: Holding two one-handed weapons allows you to attack with each using normal
        attack rules. There are no bonuses or penalties to dual wielding weapons in
        this way, but you must declare before each attack which weapon you are using.
      spans: []
    sections: []
  - title: Two-handed Weapons
    slug: two-handed-weapons
    level: 3
    content:
    - type: paragraph
      text: Weapons with the Two Handed keyword require both hands to operate; attempting
        to use a two-handed weapon one-handed imposes +1 penalty die to your attack
        roll. In the case of a two-handed melee weapon used one-handed, it also deals
        half its regular damage on a hit (rounded up).
      spans: []
    sections: []
  - title: Prone (ranged)
    slug: prone-ranged
    level: 3
    content:
    - type: paragraph
      text: When prone and using a ranged weapon, if you Fully Commit to an attack,
        gain an additional +1 bonus die. Attacks with a ranged weapon against a prone
        target outside of Very Near range gain +1 penalty die.
      spans: []
    sections: []
  - title: Critical Hits
    slug: critical-hits
    level: 3
    content:
    - type: paragraph
      text: If you attack an enemy and roll 4+ over your weapon’s Use DC (taking into
        account cover and anything else that might affect the DC), you have hit with
        an Extreme Success, which is considered a critical hit. Critical hits deal
        additional damage according to the critical hit table below.
      spans:
      - style: bold
        text: critical hit
    - type: paragraph
      text: On a critical hit, the target gains +1 Stress in addition to stress they
        would gain by being injured.
      spans:
      - style: bold
        text: +1 Stress
    - type: table
      rows:
      - - &id001
          text: Critical Hit Table
          spans: []
        - *id001
      - - text: Roll Exceeds DC by…
          spans:
          - style: bold
            text: Roll Exceeds DC by…
        - text: Extra Damage
          spans:
          - style: bold
            text: Extra Damage
      - - text: 4-6
          spans: []
        - text: '2'
          spans: []
      - - text: 7-8
          spans: []
        - text: '3'
          spans: []
      - - text: 9+
          spans: []
        - text: '4'
          spans: []
    - type: table
      rows:
      - - &id002
          text: Ranged weapons attacking within Very Near range
          spans: []
        - *id002
      - - text: Weapon type
          spans:
          - style: bold
            text: Weapon type
        - text: Information
          spans:
          - style: bold
            text: Information
      - - text: Light
          spans: []
        - text: No penalty
          spans: []
      - - text: Medium
          spans: []
        - text: +1 penalty die
          spans: []
      - - text: Heavy
          spans: []
        - text: +2 penalty dice
          spans: []
      - - text: Exotic
          spans: []
        - text: +1 penalty die
          spans: []
    sections: []
- title: Melee Combat
  slug: melee-combat
  level: 2
  content: []
  sections:
  - title: Flanking
    slug: flanking
    level: 3
    content:
    - type: paragraph
      text: Whenever you and your allies outnumber enemy characters in melee combat,
        you receive +1 bonus die to your attacks against those enemies. The opposite
        is also true; if you are outnumbered in melee combat, enemies receive a bonus
        die to their attacks.
      spans: []
    sections: []
  - title: Prone (melee)
    slug: prone-melee
    level: 3
    content:
    - type: paragraph
      text: When melee attacking while prone, you gain +1 penalty die to your attack
        rolls. If the target is prone, you gain +1 bonus die to attack rolls against
        them. Thus, if you and your target are both prone, you gain both +1 penalty
        and +1 bonus die which cancel each other out and give you a straight roll.
      spans: []
    sections: []
  - title: Called Shots
    slug: called-shots
    level: 3
    content:
    - type: paragraph
      text: You may choose to take a penalty die to your attack roll to try to hit
        a specific part of your target. To make a called shot, you must have direct
        line of sight with the part of your enemy you are trying to shoot. Thus, making
        a called shot on an enemy’s head is impossible when their head is reasonably
        determined to be hidden from view.
      spans: []
    - type: list
      ordered: false
      items:
      - text: Head
        spans:
        - style: bold
          text: Head
    - type: list
      ordered: false
      items:
      - text: Inflict +2 damage on this attack
        spans: []
      - text: Target gains Agonized (1) condition (Agonized (2) instead if the Called
          Shot was a critical hit)
        spans: []
    - type: list
      ordered: false
      items:
      - text: Stomach
        spans:
        - style: bold
          text: Stomach
    - type: list
      ordered: false
      items:
      - text: Target gains Bleeding (1) condition (Bleeding (2) instead if the Called
          Shot was a critical hit)
        spans: []
    - type: list
      ordered: false
      items:
      - text: Legs/feet
        spans:
        - style: bold
          text: Legs/feet
    - type: list
      ordered: false
      items:
      - text: Impose +2 movement penalties to target until end of combat or treated
          with First Aid (DC6)
        spans:
        - style: bold
          text: First Aid (DC6)
      - text: Inflict -1 damage on this attack
        spans: []
    - type: list
      ordered: false
      items:
      - text: Hand
        spans:
        - style: bold
          text: Hand
    - type: list
      ordered: false
      items:
      - text: Target must drop what it’s holding
        spans: []
    - type: paragraph
      text: The GM may allow other called shot locations using the above examples
        as a guideline.
      spans: []
    - type: paragraph
      text: Conditions and other effects caused by a called shot apply only if the
        attack wounds the target (deals damage through worn armour).
      spans: []
    sections: []
  - title: Melee attacks
    slug: melee-attacks
    level: 3
    content:
    - type: paragraph
      text: Functionally, these are the same as ranged attacks. If a melee attack
        is made at a target outside of Melee range, the attack automatically fails.
      spans: []
    sections: []
  - title: Unarmed Attacks
    slug: unarmed-attacks
    level: 3
    content:
    - type: paragraph
      text: When making an unarmed attack, roll Melee (unarmed). Choose one of PHYS
        or REF to determine the attack’s Use DC, damage, and additional effects. Unarmed
        attacks deal Blunt damage.
      spans: []
    sections:
    - title: Unarmed attacking using REF
      slug: unarmed-attacking-using-ref
      level: 4
      content:
      - type: paragraph
        text: Use DC = 9 - REF
        spans:
        - style: bold
          text: Use DC = 9 - REF
      - type: paragraph
        text: Damage = 1
        spans: []
      - type: paragraph
        text: Ignore the penalty die for making a Called Shot for this attack.
        spans: []
      sections: []
    - title: Unarmed attacking using PHYS
      slug: unarmed-attacking-using-phys
      level: 4
      content:
      - type: paragraph
        text: Use DC = 11 - PHYS
        spans:
        - style: bold
          text: Use DC = 11 - PHYS
      - type: paragraph
        text: Damage = PHYS
        spans: []
      - type: paragraph
        text: On an extreme success, you may take the Grapple combat action without
          spending an action to do so.
        spans: []
      sections: []
  - title: Improvised Weapons
    slug: improvised-weapons
    level: 3
    content:
    - type: paragraph
      text: Improvised weapons can be anything from a chair leg to a computer terminal.
        Improvised weapons count as melee weapons for attack rolls and other rules.
        They commonly have a Use DC of 10 and deal damage equal to 1 + half your character’s
        PHYS or REF, rounded up.
      spans: []
    - type: paragraph
      text: The GM may decide to lower or increase either the Use DC or the damage
        of an improvised weapon as they see fit. They usually break on an extreme
        failure, or after a few solid hits (GM discretion).
      spans: []
    - type: paragraph
      text: Improvised weapons are often Blunt, but the GM determines the damage type.
      spans: []
    sections: []
  - title: Throwing weapons
    slug: throwing-weapons
    level: 3
    content:
    - type: paragraph
      text: Any weapon may be thrown at an adversary. To do so, roll a throw check,
        as described below. Most weapons are not designed with throwing in mind, and
        for this reason a weapon without the Thrown keyword imposes +1 penalty die
        on the attack roll. A thrown weapon has a range of Very Near and counts as
        a ranged attack.
      spans: []
    - type: paragraph
      text: Unless a weapon has the Thrown keyword, throwing it always uses a character’s
        PHYS attribute. It does damage equal to ½ the weapon’s bulk, rounded down
        (minimum 1 damage).
      spans:
      - style: bold
        text: PHYS
    - type: paragraph
      text: Thrown Weapon Use DC = 8 + weapon’s bulk
      spans:
      - style: bold
        text: Thrown Weapon Use DC = 8 + weapon’s bulk
    sections:
    - title: Thrown Keyword
      slug: thrown-keyword
      level: 4
      content:
      - type: paragraph
        text: Weapons with the Thrown keyword always use the weapon’s Use DC for throwing
          and deal the weapon’s normal damage upon hit. A character may choose to
          use either PHYS or REF to throw it. Unless otherwise specified, grenades
          have a Use DC of 8.
        spans:
        - style: bold
          text: use the weapon’s Use DC
        - style: bold
          text: grenades have a Use DC of 8
      sections: []
    - title: Missed Throws
      slug: missed-throws
      level: 4
      content:
      - type: paragraph
        text: Most of the time, a thrown weapon or item will travel in the direction
          it was thrown in, however it may not always make it to its intended destination.
          When you roll a throw check and fail, the GM determines a location within
          Very Near range of your target; that’s where the thrown object lands. On
          an extreme failure, the GM instead chooses a location within Near range
          of your target as the point of impact.
        spans: []
      sections: []
- title: Armour
  slug: armour
  level: 2
  content:
  - type: paragraph
    text: 'Armour provides damage mitigation based on its Protection rating. This
      works very simply:'
    spans:
    - style: bold
      text: Protection
  - type: paragraph
    text: Damage Taken = Incoming Damage - Armour Protection
    spans:
    - style: bold
      text: Damage Taken = Incoming Damage - Armour Protection
  - type: paragraph
    text: Thus, being shot by a weapon that deals 3 damage would normally give you
      3 wounds. Wearing armour with Protection 2 would reduce that to 1 wound.
    spans: []
  sections:
  - title: Order of operations
    slug: order-of-operations
    level: 3
    content:
    - type: paragraph
      text: 'When you get hit, here’s a quick list of what to do:'
      spans: []
    - type: paragraph
      text: 'First, determine the total amount of incoming damage as well as the type
        of that damage:'
      spans:
      - style: bold
        text: First
      - style: bold
        text: incoming damage
    - type: list
      ordered: false
      items:
      - text: Incoming Damage is the total amount of damage from an attack or effect,
          taking into account weapon keywords, critical hit damage, called shot damage,
          or anything else that would modify the amount of damage dealt on the incoming
          attack.
        spans:
        - style: bold
          text: Incoming Damage
    - type: paragraph
      text: 'Second, determine your total armour protection:'
      spans:
      - style: bold
        text: Second
      - style: bold
        text: armour protection
    - type: list
      ordered: false
      items:
      - text: Armour Protection includes the armour’s Protection value as well as
          all bonuses from things like Resistance to the incoming damage type or Frontal
          Shielding, as well as all negatives from Vulnerability or other sources.
          For example, taking energy damage while wearing armour with 2 protection
          and Vulnerable (Energy 1) would give a total Armour Protection of 1 against
          the incoming damage.
        spans:
        - style: bold
          text: Armour Protection
    - type: paragraph
      text: Third, calculate the damage taken using those two numbers and the Damage
        Taken formula above, translating that to wounds via the wound track.
      spans:
      - style: bold
        text: Third
      - style: bold
        text: damage taken
      - style: bold
        text: Damage Taken
      - style: link_underline
        text: wound track
        href: health-wounds.yaml#wound-tracking
    - type: paragraph
      text: Finally, apply any additional effects from the attack as well as resolve
        armour durability loss.
      spans:
      - style: bold
        text: Finally
    sections: []
  - title: Durability
    slug: durability
    level: 3
    content:
    - type: paragraph
      text: All armour has a Durability rating. When damage from a combat source (being
        shot, stabbed, etc) gets through your armour (damages you), reduce that armour’s
        durability by 1. If the armour’s durability ever drops to 0, the armour is
        broken and completely useless at stopping damage; it no longer provides any
        Protection or other benefits it may have provided. It does still take up inventory
        slots as normal, and must be removed as normal before equipping other armour.
      spans: []
    - type: paragraph
      text: Some weapons or effects (such as Shredding weapons) deal additional durability
        loss; this is cumulative with the normal durability loss from being injured
        while wearing armour.
      spans: []
    - type: paragraph
      text: At the GM’s discretion, environmental effects or other types of damage
        could reduce armour’s durability as well.
      spans: []
    sections: []
  - title: Putting On and Taking Off Armour
    slug: putting-on-and-taking-off-armour
    level: 3
    content:
    - type: paragraph
      text: Donning or doffing armour takes a number of actions equal to the armour’s
        Bulk rating * 3. Thus removing armour with Bulk 3 would take 9 actions to
        do. These actions may be spread across multiple rounds, and progress is preserved
        if the process is interrupted.
      spans: []
    - type: paragraph
      text: Armour provides no Protection while it is being put on or taken off.
      spans: []
    sections: []
  - title: EVA Suits
    slug: eva-suits
    level: 3
    content:
    - type: paragraph
      text: Extravehicular Activity suits are specialized space suits worn to survive
        in space. They provide pressure control, temperature regulation, and an oxygen
        supply while functional.
      spans: []
    sections:
    - title: Suit Breach
      slug: suit-breach
      level: 4
      content:
      - type: paragraph
        text: Any durability loss reduces the efficacy of an EVA suit. A damaged suit
          provides life support for a number of rounds equal to its maximum durability.
          After that, the wearer takes on the Asphyxiating condition.
        spans:
        - style: link_underline
          text: Asphyxiating
          href: conditions.yaml#asphyxiating
      - type: paragraph
        text: Patching such a suit breach may be done with a successful Repair roll.
          Unlike normal repair rolls, patching a suit takes 2 actions and does not
          restore lost durability; instead, it negates the suit breach. An EVA suit
          with 0 durability imposes a penalty die on any attempt to patch it, and
          requires an Extreme Success on the Repair roll to patch successfully.
        spans:
        - style: link_underline
          text: Repair
          href: equipment-gear.yaml#repair-and-modification
      sections: []
  - title: Wearing Multiple Pieces of Armour
    slug: wearing-multiple-pieces-of-armour
    level: 3
    content:
    - type: paragraph
      text: You cannot wear more than one item of armour unless otherwise specified
        by the armour itself.
      spans: []
    - type: paragraph
      text: If you do wear more than one piece of armour, all worn armour loses durability
        at the same rate.
      spans: []
    sections: []
  - title: Unmitigated damage
    slug: unmitigated-damage
    level: 3
    content:
    - type: paragraph
      text: Some damage sources deal ‘unmitigated damage’. Armour does not reduce
        this type of damage at all. Bleeding or falling from a height are examples
        of unmitigated damage.
      spans: []
    sections: []
- title: Damage Types
  slug: damage-types
  level: 2
  content:
  - type: table
    rows:
    - - &id003
        text: Damage Types
        spans: []
      - *id003
      - *id003
    - - text: Type
        spans:
        - style: bold
          text: Type
      - text: Special Effects
        spans:
        - style: bold
          text: Special Effects
      - text: Description
        spans:
        - style: bold
          text: Description
    - - text: Energy
        spans: []
      - text: +1 damage to robots, drones, etc
        spans: []
      - text: Electricity, heat, cold
        spans: []
    - - text: Ballistic
        spans: []
      - text: '-'
        spans: []
      - text: Bullets, thrown weapons
        spans: []
    - - text: Blade
        spans: []
      - text: '-'
        spans: []
      - text: Swords, knives, razorblades
        spans: []
    - - text: Blunt
        spans: []
      - text: '-'
        spans: []
      - text: Fists, baseball bats, battering rams
        spans: []
    - - text: Explosive
        spans: []
      - text: +2 damage to structures, vehicles, or anything with hull points.
        spans: []
      - text: Bombs, rockets, grenades
        spans: []
  sections: []
- title: Combat actions
  slug: combat-actions
  level: 2
  content:
  - type: paragraph
    text: Each character gets three actions and one reaction per round of combat.
      These actions may be spent in any combination of ways. For example, a character
      could choose to triple-move (use the ‘move’ action three times in a row), triple-shoot
      (fire his weapon three times in a row - though at a penalty for the second and
      third shot), or combine actions in any way he sees fit (move, shoot, move again,
      etc). A character’s turn ends either when he runs out of available actions or
      chooses to end his turn with one or more actions remaining (saving actions for
      potential reactions, for example).
    spans: []
  - type: paragraph
    text: Any unused actions may be used as Reactions until the start of your next
      turn. Unused actions or reactions are wasted, as you once again get three actions
      and one reaction at this point.
    spans:
    - style: bold
      text: Unused actions or reactions are wasted
  sections:
  - title: Reactions
    slug: reactions
    level: 3
    content:
    - type: paragraph
      text: At the start of combat as well as the start of each of your turns, you
        gain 1 reaction.
      spans: []
    - type: paragraph
      text: A Character performs a reaction in response to external stimuli (called
        the trigger; this is described by the reaction). A reaction may be performed
        at any time, not just on his turn. To use a reaction (for example, Dive for
        Cover), a character must use one reaction, unless otherwise specified. If
        he has no remaining reactions this round, he cannot use a reaction at all.
      spans:
      - style: bold
        text: trigger
    - type: paragraph
      text: 'Note: unless otherwise stated, a reaction takes place before whatever
        triggered it is completed. Thus, a character using the Parry reaction will
        declare the reaction and make the roll required after an attack is declared
        against him (the trigger for the reaction), but before the attack is completed
        and he takes any damage.'
      spans:
      - style: bold
        text: before
      - style: italic
        text: Parry
      - style: bold
        text: after
      - style: bold
        text: before
    sections: []
  - title: Free actions
    slug: free-actions
    level: 3
    content:
    - type: paragraph
      text: Free actions may be done at any point during your turn without requiring
        the use of an action. Making a free action when it’s not your turn may be
        done at any point, but requires the use of 1 reaction.
      spans: []
    sections: []
  - title: List of Actions, Reactions, and Free Actions
    slug: list-of-actions-reactions-and-free-actions
    level: 3
    content:
    - type: table
      rows:
      - - &id004
          text: Actions
          spans: []
        - *id004
        - *id004
      - - text: Name
          spans:
          - style: bold
            text: Name
        - text: Cost
          spans:
          - style: bold
            text: Cost
        - text: Description
          spans:
          - style: bold
            text: Description
      - - text: Aim
          spans: []
        - text: 1 action
          spans: []
        - text: Take a moment to aim before firing. Aiming allows your next ranged
            attack to target up to one range band farther than your weapon’s Range
            without increasing the attack’s DC.
          spans: []
      - - text: Move
          spans: []
        - text: 1 action
          spans: []
        - text: 'A character may change stance (prone, crouching, standing) and move
            up to his allotted movement distance. This movement may be split around
            other actions. For example, a character may choose to move slightly, attack
            an enemy, then move again. Both those movements may be part of the same
            Move action. When split in this way, the total distance a character moves
            can never exceed his Movement Speed.


            If you use more than one move action during your turn, each successive
            move action imposes +1 movement penalty (cumulative). So a third movement
            action would be made with +2 movement penalties.'
          spans: []
      - - text: Draw weapon
          spans: []
        - text: 1 action (2 if stowed)
          spans: []
        - text: Draw your weapon for use.
          spans: []
      - - text: Attack
          spans: []
        - text: 1 action
          spans: []
        - text: Make an attack against an opponent within range. Must have a drawn
            weapon or make an unarmed attack. Once an attack is made, any subsequent
            attacks you make suffer +1 Penalty die until the start of your next turn.
          spans:
          - style: link_underline
            text: unarmed attack
            href: '#unarmed-attacks'
      - - text: Reload
          spans: []
        - text: 1 action
          spans: []
        - text: Reset your weapon’s ammo to full.
          spans: []
      - - text: Interact
          spans: []
        - text: 1 action
          spans: []
        - text: Inject an ally with a syringe, interact with a console to open a door,
            etc.
          spans: []
      - - text: Grapple
          spans: []
        - text: 1 action
          spans: []
        - text: Roll Melee (unarmed). The defender also rolls either Melee (unarmed)
            or Evade, their choice. If you win the skill contest (roll higher than
            the defender), you have successfully grappled them (see Conditions below).
          spans:
          - style: bold
            text: higher
          - style: link_italic_underline
            text: grappled
            href: conditions.yaml#grappled
          - style: link_underline
            text: Conditions
            href: conditions.yaml#conditions
      - - text: Aid
          spans: []
        - text: 1 action
          spans: []
        - text: 'You prepare to assist an ally with a skill check.

            Choose a specific skill your ally is about to use and describe how you
            will help them with that skill check.

            You must have at least 1 rank in the skill being aided. Only one character
            may Aid a check. Aid cannot be used on attacks, reactions, or checks made
            to resist an effect. GM discretion is encouraged to determine whether
            a task can benefit from the proposed assistance.'
          spans:
          - style: bold
            text: at least 1 rank
          blocks:
          - type: list
            ordered: false
            items:
            - text: When they make the check, you may spend a Use Held Action reaction
                to assist them.
              spans:
              - style: bold
                text: Use Held Action
            - text: If you do, they gain +1 bonus die on that roll.
              spans:
              - style: bold
                text: +1 bonus die
      - - text: Suppressing Fire
          spans: []
        - text: 1 action
          spans: []
        - text: 'Choose a direction or a location within your weapon’s range, then
            spend 1 ammo. Until the start of your next turn, the first time each enemy
            you can see enters or moves from that direction or location, they must
            make a Cool Under Fire (DC4 + ammo used) check. This effect occurs once
            per ammo spent, up to a maximum of three times.


            Suppressing fire may only be used with a ranged weapon.'
          spans:
          - style: bold
            text: Cool Under Fire (DC4 + ammo used)
          - style: bold
            text: once per ammo spent
          blocks:
          - type: list
            ordered: false
            items:
            - text: 'Extreme success: no effect.'
              spans:
              - style: bold
                text: Extreme success
            - text: 'Success: enemy gains +1 movement penalty.'
              spans:
              - style: bold
                text: Success
            - text: 'Failure: enemy gains +1 stress and +1 movement penalty.'
              spans:
              - style: bold
                text: Failure
            - text: 'Extreme failure: enemy gains +1 stress and immediately falls
                prone, ending their movement.'
              spans:
              - style: bold
                text: Extreme failure
      - - text: Hack an interface or enemy
          spans: []
        - text: 2 action
          spans: []
        - text: Attempt to complete one step of the hacking sequence. The Simple Hacking
            optional rule may be used for this at the GMs discretion.
          spans:
          - style: link_underline
            text: Simple Hacking
            href: hacking.yaml#optional-rule-simple-hacking
      - - text: Intimidate
          spans: []
        - text: 1 action
          spans: []
        - text: 'Attempt to demoralize or frighten an enemy. Roll Bearing, Persuade,
            or Subterfuge (DC 12 - enemy’s stress level). Gain a bonus die to this
            roll if the enemy was injured within the last round, another enemy was
            killed during combat, or the enemy is outnumbered.

            Using Intimidate for a second time during a round uses 2 actions instead
            of 1.'
          spans:
          - style: bold
            text: Bearing
          - style: bold
            text: Persuade
          - style: bold
            text: Subterfuge (DC 12 - enemy’s stress level)
          - style: link_underline
            text: outnumbered
            href: '#flanking'
          blocks:
          - type: list
            ordered: false
            items:
            - text: Extreme success, target suffers +2 stress and is Demoralized (2).
              spans:
              - style: bold
                text: Extreme success
              - style: link_underline
                text: Demoralized (2)
                href: conditions.yaml#demoralized-x
            - text: 'Success: target is Demoralized (1).'
              spans:
              - style: bold
                text: Success
              - style: link_underline
                text: Demoralized (1)
                href: conditions.yaml#demoralized-x
      - - text: Hold Action
          spans: []
        - text: 1 action
          spans: []
        - text: Prepare to use an action on another character’s turn. To do so, choose
            an action you would like to prepare as well as a trigger that will prompt
            its use. For example, “I will hold an Attack action. The trigger will
            be any enemy entering my range.” If no trigger is given, the held action
            cannot be used.
          spans: []
      - - text: Teamwork
          spans: []
        - text: 1 action
          spans: []
        - text: 'Co-ordinate with teammates. Choose any number of allies within Near
            range; roll Tactics (DC4 + 3 per ally).

            A character may benefit from Teamwork no more than once per round.'
          spans:
          - style: bold
            text: Tactics (DC4 + 3 per ally)
          blocks:
          - type: list
            ordered: false
            items:
            - text: 'Extreme Success: you and targeted allies gain +1 Bonus die to
                a roll of your or their choice before the start of your next turn.'
              spans:
              - style: bold
                text: Extreme Success
          - type: list
            ordered: false
            items:
            - text: 'Success: each targeted ally gains +1 Bonus die to a roll of their
                choice before the start of your next turn.'
              spans:
              - style: bold
                text: Success
      - - text: Pick Up/Grab
          spans: []
        - text: 1 action
          spans: []
        - text: Pick up an item within melee range. If the item is being held by a
            target unwilling to give it to you, they must be successfully grappled
            before you can grab the item from them. Doing so requires an opposed Powerlift
            roll; you succeed in taking the item on a higher or equal roll.
          spans:
          - style: bold
            text: Powerlift
      - - text: Execute
          spans: []
        - text: 2 actions
          spans: []
        - text: 'Make an attack as normal against a character within Melee range who
            is Dying, Unconscious, or otherwise completely helpless (GM discretion).

            After a successful Execute action, make a Composure (DC6 + your Empathy)
            check.'
          spans:
          - style: bold
            text: Dying
          - style: bold
            text: Unconscious
          - style: bold
            text: completely helpless
          - style: bold
            text: Composure (DC6 + your Empathy)
          blocks:
          - type: list
            ordered: false
            items:
            - text: 'Success: target dies.'
              spans:
              - style: bold
                text: Success
            - text: 'Failure: no effect.'
              spans:
              - style: bold
                text: Failure
          - type: list
            ordered: false
            items:
            - text: 'Success: no effect'
              spans:
              - style: bold
                text: Success
            - text: 'Failure: suffer +1 stress.'
              spans:
              - style: bold
                text: Failure
            - text: 'Extreme failure: suffer +2 stress.'
              spans:
              - style: bold
                text: Extreme failure
      - - text: ''
          spans: []
        - text: ''
          spans: []
        - text: ''
          spans: []
      - - text: ''
          spans: []
        - text: ''
          spans: []
        - text: ''
          spans: []
    - type: table
      rows:
      - - &id005
          text: Reactions
          spans: []
        - *id005
        - *id005
        - *id005
      - - text: Name
          spans:
          - style: bold
            text: Name
        - text: Cost
          spans:
          - style: bold
            text: Cost
        - text: Trigger
          spans:
          - style: bold
            text: Trigger
        - text: Description
          spans:
          - style: bold
            text: Description
      - - text: Dive for Cover
          spans: []
        - text: 1 reaction
          spans: []
        - text: Targeted by ranged attack
          spans: []
        - text: See Dive for Cover below.
          spans:
          - style: link_underline
            text: Dive for Cover
            href: '#special-rule-dive-for-cover'
      - - text: Parry
          spans: []
        - text: 1 reaction
          spans: []
        - text: Targeted by melee attack
          spans: []
        - text: Requires melee weapon. Roll Melee (Weapons) (DC 8 + attacker’s weapon
            skill).
          spans:
          - style: bold
            text: Melee (Weapons) (DC 8 + attacker’s weapon skill)
          blocks:
          - type: list
            ordered: false
            items:
            - text: 'Extreme Success: you may immediately use 1 additional reaction
                to attack your attacker.'
              spans:
              - style: bold
                text: Extreme Success
            - text: 'Success: attack against you fails.'
              spans:
              - style: bold
                text: Success
      - - text: Dodge
          spans: []
        - text: 1 reaction
          spans: []
        - text: Targeted by melee attack or throw action
          spans: []
        - text: Roll Evade. If your roll is higher than the melee attack roll against
            you, the attack fails.
          spans:
          - style: bold
            text: Evade
      - - text: Deflect/Catch
          spans: []
        - text: 1 reaction
          spans: []
        - text: Thrown object passes within melee range of you
          spans: []
        - text: Roll Finesse. If your roll is higher than the throw roll, you successfully
            deflect or catch the thrown object.
          spans:
          - style: bold
            text: Finesse
          blocks:
          - type: list
            ordered: false
            items:
            - text: 'Extreme success: you may catch or deflect object away from you
                (choose a location within Very Near range to deflect it to).'
              spans:
              - style: bold
                text: Extreme success
            - text: 'Success: you may catch or deflect object away from you (GM decides
                where). If the object would deal damage on impact, take half that
                damage.'
              spans:
              - style: bold
                text: Success
      - - text: Use Held Action
          spans: []
        - text: Minimum 1 reaction
          spans: []
        - text: Custom (given when action was held)
          spans: []
        - text: Use the held action immediately. Using a held action costs the same
            number of reactions the action would normally cost in actions. For example,
            using an Attack action costs 1 reaction, while using an Execute action
            costs 2 reactions.
          spans: []
    - type: table
      rows:
      - - &id006
          text: Free Actions
          spans: []
        - *id006
      - - text: Name
          spans:
          - style: bold
            text: Name
        - text: Description
          spans:
          - style: bold
            text: Description
      - - text: Drop
          spans: []
        - text: Drop any held object, item, or character.
          spans: []
      - - text: Speak
          spans: []
        - text: Say something out loud. This should be more of a sentence than a paragraph.
          spans: []
      - - text: ''
          spans: []
        - text: ''
          spans: []
    sections: []
  - title: 'Special rule: Dive for Cover'
    slug: special-rule-dive-for-cover
    level: 3
    content:
    - type: paragraph
      text: 'When attacked by an enemy using a ranged weapon, a character may use
        a reaction to Dive for Cover providing:'
      spans:
      - style: italic
        text: Dive for Cover
    - type: list
      ordered: false
      items:
      - text: They are aware of the incoming attack (can see the enemy pointing the
          weapon at them, for example) OR they succeed a DC7 Instinct check.
        spans: []
      - text: They are standing up.
        spans: []
      - text: They are not grappled or otherwise immobilized.
        spans: []
    - type: paragraph
      text: Diving for cover allows you to leap up to 10 feet in any direction and
        hit the ground, ending up prone. This can get you out of or farther away from
        danger. When you dive for cover, the enemy attack against you is made at +2
        DC. This does not apply for subsequent attacks, however if you dive for cover
        behind partial or full cover, then subsequent attacks against you are made
        using cover rules as normal. The initial attack you dove for cover to avoid
        is not subject to increased DC based on you getting behind cover, as the attack
        occurs while you are moving (before cover is reached).
      spans:
      - style: bold
        text: prone
      - style: bold
        text: +2 DC
    sections: []
- title: Ranges
  slug: ranges
  level: 2
  content:
  - type: paragraph
    text: Combat ranges are defined in general terms as melee, very near, near, medium,
      long, very long, and extreme.
    spans:
    - style: italic
      text: melee, very near, near, medium, long, very long,
    - style: italic
      text: extreme.
  - type: table
    rows:
    - - text: Melee
        spans: []
      - text: Very Near
        spans: []
      - text: Near
        spans: []
      - text: Medium
        spans: []
      - text: Long
        spans: []
      - text: Very Long
        spans: []
      - text: Extreme
        spans: []
    - - text: Within 5 feet
        spans: []
      - text: 6-15 feet
        spans: []
      - text: 16-30 feet
        spans: []
      - text: 31-60 feet
        spans: []
      - text: 61-120 feet
        spans: []
      - text: 121-250 feet
        spans: []
      - text: Over 250 feet, up to 500 feet
        spans: []
  - type: paragraph
    text: 'In space, ranges are defined differently:'
    spans: []
  - type: table
    rows:
    - - text: Boarding
        spans: []
      - text: Very Near
        spans: []
      - text: Near
        spans: []
      - text: Medium
        spans: []
      - text: Long
        spans: []
      - text: Very Long
        spans: []
      - text: Extreme
        spans: []
    - - text: Within 0.5 km
        spans: []
      - text: 0.6 to 5 km
        spans: []
      - text: 6-15 km
        spans: []
      - text: 16-50 km
        spans: []
      - text: 51-100 km
        spans: []
      - text: 101-150
        spans: []
      - text: Over 150 km, up to 500km
        spans: []
  sections: []
- title: Cover
  slug: cover
  level: 2
  content:
  - type: paragraph
    text: A character is behind cover when at least part of their body is obscured
      from direct line of sight from attacking characters. Cover can be either partial
      cover in which case much of the character is still exposed, or full cover in
      which almost the entire character’s body is protected and out of sight. If a
      character is completely hidden, he or she cannot be attacked directly at all.
    spans:
    - style: italic
      text: partial cover
    - style: italic
      text: full cover
  sections:
  - title: Partial Cover
    slug: partial-cover
    level: 3
    content:
    - type: paragraph
      text: Lying prone behind a park bench, standing behind a tree, or throwing a
        table onto its side and kneeling behind it; these are examples of partial
        cover, which is defined as being obscured from an attacker in such a way as
        reasonably blocks direct line of sight of up to half a character’s body. Being
        behind partial cover gives a character a +2 to the DC of anyone trying to
        attack them.
      spans:
      - style: italic
        text: being obscured from an attacker in such a way as reasonably blocks direct
          line of sight of up to half a character’s body.
    sections: []
  - title: Full Cover
    slug: full-cover
    level: 3
    content:
    - type: paragraph
      text: Kneeling behind a car, lying prone behind a large log, or standing in
        a trench are all examples of full cover, which is defined as being obscured
        from an attacker’s view in such a way as reasonably blocks direct line of
        sight of almost the entirety of the character’s body. Characters behind full
        cover receive a +4 to the DC to hit them.
      spans:
      - style: italic
        text: being obscured from an attacker’s view in such a way as reasonably blocks
          direct line of sight of almost the entirety of the character’s body.
    sections: []
  - title: Cover durability
    slug: cover-durability
    level: 3
    content:
    - type: paragraph
      text: In order for cover to be effective, it must be able to withstand an attack
        meant for the character using it. If an attack is intended for a character
        but hits the cover instead, would that cover stop the attack? Depending on
        the type of cover, it may be effective at stopping many attacks (kneeling
        behind a car), a single attack (lying prone behind a park bench), or part
        of an attack (kneeling behind an overturned table). The GM determines the
        durability of the cover available to you. If cover is unable to block even
        a single wound of damage, it cannot be considered cover. It could still potentially
        serve as camouflage, depending on the situation.
      spans: []
    - type: paragraph
      text: Cover takes damage when an attack made against the person using the cover
        misses. The amount of damage taken is equal to the damage from the attacker’s
        weapon. If more damage is dealt to the cover than it has remaining durability,
        there is a 50% chance the remaining damage is transferred to the character
        behind the cover. This is rolled by the GM.
      spans: []
    - type: paragraph
      text: If an object that provides full cover is reduced to 0 durability, the
        GM has a choice to make. Either the cover is destroyed completely (as might
        be the case of a car struck by the main turret of a tank) or the cover level
        is reduced to partial and given new (probably lesser) durability in its new
        state. This might be the case if a table were shot by a pistol. If the cover
        was partial cover and its durability reaches 0, it is no longer capable of
        providing cover.
      spans: []
    - type: table
      rows:
      - - &id007
          text: Reasonable Cover Durability
          spans: []
        - *id007
        - *id007
      - - text: Cover
          spans:
          - style: bold
            text: Cover
        - text: Type
          spans:
          - style: bold
            text: Type
        - text: Suggested Durability
          spans:
          - style: bold
            text: Suggested Durability
      - - text: Overturned Table
          spans: []
        - text: Partial
          spans: []
        - text: 2 wounds
          spans: []
      - - text: Tree Stump
          spans: []
        - text: Partial
          spans: []
        - text: 5 wounds
          spans: []
      - - text: Car
          spans: []
        - text: Full
          spans: []
        - text: Indestructible unless hit by a high-powered weapon or explosives.
          spans: []
    sections: []
  - title: Human Shields
    slug: human-shields
    level: 3
    content:
    - type: paragraph
      text: Using a character as cover is possible. The character should be treated
        as partial cover for the character behind them and the same rules for damage
        should be applied.
      spans: []
    sections: []
